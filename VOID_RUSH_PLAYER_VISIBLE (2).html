<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOID//RUSH — Player Fix</title>
<style>
html,body{margin:0;background:#05070d;color:#fff;font-family:system-ui,sans-serif}
.wrap{max-width:1000px;margin:18px auto;padding:12px}
canvas{display:block;width:100%;background:#07101d;border:2px solid #33425d;border-radius:12px;image-rendering:auto}
.info{padding:10px 4px;color:#aebbd1;font-size:14px}
button{background:#101c31;color:white;border:1px solid #5de6ff;border-radius:8px;padding:10px 18px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
<canvas id="game" width="1000" height="560"></canvas>
<div class="info">← → 이동 · SPACE 점프 · SHIFT 대시 · R 재시작</div>
<button onclick="restart()">RESTART</button>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let keys={}, player, cam=0, last=performance.now(), deaths=0, start=performance.now();

addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(["Space","ArrowUp","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
  if(e.code==="KeyR")restart();
});
addEventListener("keyup",e=>keys[e.code]=false);

const platforms=[
 {x:-200,y:470,w:900,h:90},{x:820,y:410,w:150,h:25},
 {x:1080,y:350,w:120,h:25},{x:1320,y:285,w:130,h:25},
 {x:1570,y:390,w:150,h:25},{x:1830,y:315,w:130,h:25},
 {x:2070,y:450,w:360,h:35},{x:2520,y:365,w:120,h:25},
 {x:2760,y:275,w:120,h:25},{x:3000,y:410,w:160,h:25},
 {x:3300,y:330,w:120,h:25},{x:3540,y:450,w:500,h:35}
];
const spikes=[
 {x:700,y:445,w:55,h:25},{x:970,y:385,w:50,h:25},
 {x:1200,y:325,w:55,h:25},{x:1450,y:260,w:55,h:25},
 {x:1720,y:365,w:55,h:25},{x:1960,y:290,w:55,h:25},
 {x:2430,y:425,w:70,h:25},{x:2640,y:340,w:55,h:25},
 {x:2880,y:250,w:55,h:25},{x:3160,y:385,w:60,h:25}
];

function restart(){
 player={x:100,y:390,w:42,h:64,vx:0,vy:0,onGround:false,dash:1};
 cam=0;deaths=0;start=performance.now();
}
restart();

function rectHit(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function die(){
 deaths++;
 player.x=100;player.y=390;player.vx=0;player.vy=0;player.dash=1;
}
function update(dt){
 const left=keys.ArrowLeft||keys.KeyA, right=keys.ArrowRight||keys.KeyD;
 if(left)player.vx-=1900*dt;
 if(right)player.vx+=1900*dt;
 if(!left&&!right)player.vx*=Math.pow(.001,dt);
 player.vx=Math.max(-500,Math.min(500,player.vx));

 if((keys.Space||keys.ArrowUp||keys.KeyW)&&player.onGround){
   player.vy=-900; player.onGround=false;
 }
 if((keys.ShiftLeft||keys.ShiftRight)&&player.dash){
   player.vx=(right?1:left?-1:1)*1050;
   player.vy=-80;
   player.dash=0;
   keys.ShiftLeft=keys.ShiftRight=false;
 }
 player.vy+=2400*dt;
 const oldY=player.y;
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;
 player.onGround=false;

 for(const p of platforms){
   if(rectHit(player,p)){
     if(player.vy>=0 && oldY+player.h<=p.y+12){
       player.y=p.y-player.h;player.vy=0;player.onGround=true;player.dash=1;
     }else if(player.vx>0){
       player.x=p.x-player.w;player.vx=0;
     }else if(player.vx<0){
       player.x=p.x+p.w;player.vx=0;
     }
   }
 }
 for(const s of spikes){
   const hit={x:s.x+5,y:s.y+5,w:s.w-10,h:s.h-5};
   if(rectHit(player,hit))die();
 }
 if(player.y>700)die();

 cam += (player.x-300-cam)*Math.min(1,dt*7);
 cam=Math.max(0,Math.min(3100,cam));
}

function drawPlayer(){
 // 플레이어를 월드 오브젝트보다 마지막에 그려 항상 위에 표시
 const px=player.x, py=player.y;
 ctx.save();

 // 강한 외곽 글로우
 ctx.shadowColor="#00eaff";
 ctx.shadowBlur=35;

 // 몸통
 ctx.fillStyle="#ffffff";
 ctx.strokeStyle="#020611";
 ctx.lineWidth=7;
 ctx.beginPath();
 ctx.roundRect(px,py,player.w,player.h,10);
 ctx.fill();
 ctx.stroke();

 ctx.shadowBlur=0;

 // 머리/바이저
 ctx.fillStyle="#4deaff";
 ctx.fillRect(px+4,py+7,player.w-8,14);
 ctx.fillStyle="#06111e";
 ctx.fillRect(px+19,py+10,16,8);

 // 가슴 코어
 ctx.fillStyle="#ff3f9f";
 ctx.beginPath();
 ctx.arc(px+21,py+34,7,0,Math.PI*2);
 ctx.fill();

 // 팔
 ctx.fillStyle="#4deaff";
 ctx.fillRect(px-7,py+25,7,22);
 ctx.fillRect(px+player.w,py+25,7,22);

 // 다리
 const step=Math.sin(performance.now()/90)*4*(Math.abs(player.vx)>20?1:0);
 ctx.fillStyle="#e9fbff";
 ctx.fillRect(px+5,py+player.h-2,11,18+step);
 ctx.fillRect(px+26,py+player.h-2,11,18-step);

 // 발광 원 + YOU 표시
 ctx.strokeStyle="#4deaff";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.arc(px+player.w/2,py+player.h/2,player.w*.9,0,Math.PI*2);
 ctx.stroke();

 ctx.font="900 13px system-ui";
 ctx.textAlign="center";
 ctx.fillStyle="#ffffff";
 ctx.fillText("YOU",px+player.w/2,py-14);

 ctx.restore();
}

function draw(){
 const W=canvas.width,H=canvas.height;
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#050b16");g.addColorStop(1,"#10243b");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // background
 for(let i=0;i<50;i++){
   let sx=((i*97-cam*.15)%W+W)%W, sy=(i*53)%H;
   ctx.fillStyle=i%3?"#4deaff55":"#ff3f9f66";
   ctx.fillRect(sx,sy,2,2);
 }

 ctx.save();
 ctx.translate(-cam,0);

 // platforms
 for(const p of platforms){
   ctx.fillStyle="#080d18";
   ctx.fillRect(p.x,p.y,p.w,p.h);
   ctx.fillStyle="#4deaff";
   ctx.fillRect(p.x,p.y,p.w,4);
 }

 // spikes
 for(const s of spikes){
   ctx.fillStyle="#ff315d";
   for(let xx=s.x;xx<s.x+s.w;xx+=18){
     ctx.beginPath();
     ctx.moveTo(xx,s.y+s.h);
     ctx.lineTo(xx+9,s.y);
     ctx.lineTo(xx+18,s.y+s.h);
     ctx.closePath();ctx.fill();
   }
 }

 // finish
 ctx.strokeStyle="#ff3f9f";ctx.lineWidth=5;
 ctx.strokeRect(4050,300,80,150);
 ctx.font="900 18px system-ui";ctx.fillStyle="#fff";ctx.textAlign="center";
 ctx.fillText("FINISH",4090,285);

 drawPlayer();
 ctx.restore();

 // HUD
 ctx.fillStyle="#fff";ctx.font="900 18px system-ui";ctx.textAlign="left";
 ctx.fillText("VOID//RUSH",20,32);
 ctx.font="700 14px system-ui";
 ctx.fillText("DEATHS: "+deaths,20,55);
 ctx.textAlign="right";
 ctx.fillText("DISTANCE: "+Math.max(0,Math.floor(player.x))+"m",W-20,32);

 // crosshair-like player status
 ctx.fillStyle="#4deaff";
 ctx.fillRect(20,H-22,Math.min(W-40,(player.x/4050)*(W-40)),4);
}

function loop(t){
 const dt=Math.min(.025,(t-last)/1000);last=t;
 update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
